name: Refresh rookie analyst takes

on:
  schedule:
    - cron: "0 9 * * *" # ~5am ET daily (before draft-day mornings)
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

concurrency:
  group: rookie-takes
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Generate takes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/gen-rookie-takes.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/dynasty/dashboard/rookie_takes.json
          if git diff --cached --quiet; then
            echo "No change in rookie takes."
          else
            git commit -m "Refresh rookie analyst takes [skip ci]"
            git push
          fi
